# Shark-no-Shimbun weekly digest. Parsed with the strict Shimbun dialect parser.
input: shimbun
inline_css: false

# Section order, labels, and colors match the shimbun-digest skill's sources.yaml.
# legend: label shown in the color legend (defaults to label).
# chip_style: inline CSS for the count chip in the TL;DR box.
sections:
  - { key: security, label: "Security",              stat: "Security", chip: "security items", color: "#a32d2d", chip_style: "background:#fcebeb;color:#791f1f" }
  - { key: kev,      label: "New KEV entries",       stat: "KEV",      chip: "new KEV",        color: "#d85a30", chip_style: "background:#faece7;color:#712b13", legend: "KEV" }
  - { key: releases, label: "Releases",              stat: "Releases", chip: "releases",       color: "#0f6e56", chip_style: "background:#eaf3de;color:#27500a", legend: "Release" }
  - { key: homelab,  label: "Homelab & open source", stat: "Homelab",  chip: "homelab picks",  color: "#534ab7", chip_style: "background:#eeedfe;color:#26215c", legend: "Homelab" }
  - { key: tech,     label: "Tech & Maker",          stat: "Tech",     chip: "tech picks",     color: "#0e7a8a", chip_style: "background:#e0f4f6;color:#0a4a53" }
  - { key: ai,       label: "AI & Tooling",          stat: "AI",       chip: "AI picks",       color: "#8a4af3", chip_style: "background:#f0eafe;color:#4a1fa8" }

# Used for a section without chip_style and a badge without an entry below.
chip_style_default: "background:#eee;color:#333"
badge_style_default: "background:#eee;color:#333"

# Inline CSS per item badge. Badges in the warn list (patch now, actively
# exploited, security release) also get a warning sign in the template.
badge_styles:
  "patch now":          "background:#faeeda;color:#633806"
  "actively exploited": "background:#faeeda;color:#633806"
  "security release":   "background:#faeeda;color:#633806"
  "stable":             "background:#eaf3de;color:#27500a"
  "pre-release":        "background:#eeedfe;color:#3c3489"

# Trusted HTML, like the template. {title}, {issue}, and {cutoff} are replaced
# literally with HTML-escaped values from the digest.
footer: "Generated by Claude Code Routine &middot; {title} &middot; {issue} &middot; Cutoff: {cutoff} Europe/Berlin"
